name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치 (workspace 전체)
        run: flutter pub get

      - name: 코드 생성 최신화 검증 (커밋된 생성 파일이 소스와 일치하는지)
        run: |
          ./scripts/gen.sh
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::생성 파일이 소스와 어긋났습니다. ./scripts/gen.sh 실행 후 커밋하세요."
            exit 1
          fi

      - name: 포맷 검사 (생성 파일 제외)
        run: |
          find apps packages -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' \
            ! -name 'app_localizations*.dart' ! -path '*/.dart_tool/*' \
            -print0 | xargs -0 dart format --output=none --set-exit-if-changed

      - name: 정적 분석
        run: flutter analyze

      - name: custom_lint (riverpod_lint)
        run: |
          for p in packages/app_core packages/app_mvi packages/app_network \
                   packages/app_shell packages/app_storage packages/app_design_system \
                   packages/features/feature_auth packages/features/feature_example apps/app; do
            echo "custom_lint: $p"
            (cd "$p" && dart run custom_lint)
          done

      - name: 테스트
        run: ./scripts/test.sh
