name: feature_example
description: >-
  예제 feature — 새 기능을 만들 때 이 패키지를 그대로 복제한다.
  API 호출 → 로컬 캐시 → Repository → Notifier → UI까지의 수직 슬라이스 전체를 시연한다.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  app_core:
  app_design_system:
  app_l10n:
  app_mvi:
  app_network:
  app_storage:
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^4.0.0
dev_dependencies:
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  drift: ^2.31.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
