dev_dependencies:
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0

flutter:
  uses-material-design: true
